[AntiCheat]
# Anti-cheat mode. 0 = off, 1 = silent (detect and log only, never kick), 2 = enforce.
# Start at 1 for at least a week so the thresholds can be calibrated on your own players,
# then switch to 2. Changeable at runtime with the console command: set_anticheat_mode 2
iMode=0
# What the engine does when a detector fires and the module trigger did not veto it.
bKickOnDetection=true
# Admins are never reported. Leave this on unless you are testing with an admin account.
bExemptAdmins=true
# 0 = kick only. Any positive value also applies a temporary ban for that many seconds.
iAutoTempBanSeconds=0
# Minimum seconds between two reports of the same type for the same player.
fReportCooldownSec=30.000000
# Write one summary line per player on exit and at the end of every mission.
bSummaryOnPlayerExit=true

# --- shot spread seed (closes the "perfect accuracy" exploit) ---
# Ignore a shot seed that does not match the one the server already holds. An honest client
# always sends the server its own value, so this changes nothing for legitimate players.
bValidateSeed=true
# Keep validating even in silent mode. Set to false only if a tournament should let cheaters
# keep this exploit as well.
bSeedValidationInSilentMode=true
iSeedMismatchMax=3
bSeedMismatchKick=false
# Replace the client seed with a server-random one. Closes spread compensation completely,
# but a shooter sees their own predicted arrow steer slightly during the first ~0.3 s.
# Leave off for public play, consider on for competitive servers.
bServerAuthoritativeSeed=false

# --- D1 aim snap: an instant look-direction flick immediately before an attack or a shot ---
bDetectAimSnap=true
fAimSnapDegPerSec=2400.000000
iAimSnapCorrelationMs=150
iAimSnapMaxCount=6
fAimSnapWindowSec=60.000000
bAimSnapKick=false

# --- D2 client clock skew: a Cheat Engine speedhack running on the client ---
# No gameplay advantage on an authoritative server, this is only a tamper indicator.
# Only a client running FAST is a signal. The engine clamps a frame to 0.1 s before advancing the
# mission clock, so a stalled or loading client can only lose simulated time, never gain it:
# negative skew is lag and is never reported.
bDetectTimeSkew=true
# 0.10 = the client clock ran 10% fast over a 10-second window. Honest players measure 0.
fMaxTimeSkewRatio=0.100000
# Report after this many bad windows out of the last iTimeSkewWindowSpan, not this many in a row:
# a tool toggled on for one fight never produces consecutive bad windows.
iTimeSkewWindows=3
iTimeSkewWindowSpan=8
bTimeSkewKick=false

# --- D3 spread luck: server-rolled spread far below what chance produces ---
# The honest mean is 0.25; the threshold is many sigma below it, so false positives are
# effectively impossible. Inert when bServerAuthoritativeSeed is on.
bDetectSpreadLuck=true
iSpreadWindowShots=30
fSpreadLuckMean=0.060000
bSpreadLuckKick=false

# --- D4 attack cadence: low value on an authoritative server, off by default ---
# A dagger legitimately swings ~11 times in 5 seconds, so this fires on fast weapons.
bDetectAttackCadence=false
iMaxMeleeAttacksPerWindow=16
iMaxRangedAttacksPerWindow=10
fAttackCadenceWindowSec=5.000000
bAttackCadenceKick=false

# --- D9 auto block: the most common cheat ---
# Automatically inactive when the server allows automatic blocking, and never applied to
# shield users or bots. Three signals: direction match with inhuman reaction, feint following,
# and blocks of attacks coming from outside the field of view.
bDetectAutoBlock=true
iAutoBlockWindowSamples=40
fAutoBlockMatchRate=0.900000
iAutoBlockMaxReactionMs=120
iAutoBlockFeintWindowMs=120
iAutoBlockFeintFollows=8
# Wider than any client field of view, so peripheral vision is never counted as "unseen".
fAutoBlockViewConeDeg=140.000000
iAutoBlockOffscreenMin=6
bAutoBlockKick=false

# --- D11 auto attack: the offensive mirror of auto block ---
bDetectAutoAttack=true
iAutoAttackWindowSamples=40
fAutoAttackOpenRate=0.900000
iAutoAttackMaxReactionMs=120
iAutoAttackFeintWindowMs=120
iAutoAttackFeintFollows=8
fAutoAttackChamberRate=0.600000
iAutoAttackChamberMin=30
bAutoAttackKick=false

# --- D12 aim lead: an aimbot that solves the lead for a moving target ---
# Judged on whether the error grows with shot difficulty, not on accuracy alone.
# fAimLeadHardDifficulty is distance x target lateral speed; calibrate it from the log.
bDetectAimLead=true
fAimLeadConeDeg=10.000000
fAimLeadMaxRange=80.000000
iAimLeadHardShots=25
fAimLeadHardDifficulty=20.000000
fAimLeadMaxErrDeg=0.800000
fAimLeadFlatRatio=1.500000
bAimLeadKick=false
