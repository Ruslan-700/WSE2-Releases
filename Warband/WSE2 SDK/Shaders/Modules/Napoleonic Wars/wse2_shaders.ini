faceshader_high_skin                              = faceshader_high           ; from the WSE2 effect and wse2_shaders.brf
faceshader_high_specular_skin                     = faceshader_high_specular  ; from the WSE2 effect and wse2_shaders.brf
faceshader_simple_skin                            = faceshader_simple         ; from the WSE2 effect and wse2_shaders.brf
