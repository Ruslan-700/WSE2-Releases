; wse2_shaders.ini - shader pairing table for [Graphics] bUseShaderPairs.
;
; The engine looks for this in the module folder first and falls back to the copy
; next to the executable, so every module gets the stock pairs without doing
; anything, and a module that needs different ones just drops its own copy in.
; Whichever file is found is used whole - the two are not merged, so a module can
; drop a pair it knows is wrong for its resources, not only add pairs.
;
; It tells the engine which shader to draw a mesh with when the mesh and its
; shader disagree about skinning: a mesh that carries bone weights on a shader
; that does not skin is skinned on the CPU every frame, and a mesh with no bone
; weights on a skinning shader pays 28 extra bytes per vertex and is barred from
; instancing and dynamic batching.
;
; Both sides are keyed by SHADER name, not technique name - the names OpenBRF
; shows in the shaders tab. The engine checks every line at startup against the
; shaders and techniques actually loaded and drops the ones that do not hold up,
; so a line that does not apply costs that pair and nothing else. Look for
; "SHADER PAIRS" in rgl_log.txt for the tally and one line per entry that did not
; survive, and "MESH SHADER CENSUS" for what the pairing saved.
;
; The two sections are separate on purpose. Several plain shaders share one
; skinned counterpart, so the way back cannot be inferred and has to be written
; out. A shader named in neither section keeps todays behaviour exactly.
;
; This table covers the stock Warband shader set, which every module inherits
; unless it overrides core_shaders.brf, so it is what a module gets when it ships
; no table of its own. If your module ships its own mb.fx, check each line against
; it - a technique the effect does not declare would otherwise fall back to an
; unrelated one, so the engine drops such a pair rather than trusting it.
;
; Ten lines are marked as needing the shader patch. The five skinned face and
; simple shading techniques they rely on are not declared by the effect Warband
; ships, so the patch supplies a rebuilt effect that adds them; their shader
; records ride along in wse2_shaders.brf, which the engine loads by itself from
; CommonRes or from the module's Resource folder.
;
; Without the rebuilt effect the five marked SkinFallback lines are reported as
; unavailable rather than rejected - it is the ordinary state of a stock install,
; not a fault - and their five NoSkinFallback counterparts stay accepted but can
; never fire, because nothing is put on those shaders in the first place. The
; remaining 48 lines work regardless.
;
; The patch is distributed separately because the effect it replaces is per
; module: a module shipping its own mb.fx or mb_2a.fxo needs that one rebuilt, not
; the stock one.
;
; The three face pairs cover one shader quality tier each, because a material on
; faceshader_high_specular degrades to faceshader_high and then to
; faceshader_simple as iShaderQuality drops, and the pairing applies to whichever
; one it lands on.
;
; specular_shader_bump_Instanced is tier limited: its counterpart needs shader
; quality 2, so below that the line is dropped. There is no lower-tier skinned
; bump specmap record to point it at.

[SkinFallback]
agent_shader                                 = skeleton_shader
agent_shader_Instanced                       = skeleton_shader
envmap_shader                                = specular_shader_skin            ; counterpart drops the environment map
envmap_shader_Instanced                      = specular_shader_skin            ; counterpart drops the environment map
iron_shader                                  = iron_shader_skin
iron_shader_Instanced                        = iron_shader_skin
nospecular_shader_bump                       = nospecular_shader_skin_bump
nospecular_shader_bump_Instanced             = nospecular_shader_skin_bump
nospecular_shader_noskin_bump_high           = nospecular_shader_skin_bump_high
nospecular_shader_noskin_bump_high_Instanced = nospecular_shader_skin_bump_high
render_character_shadow                      = render_character_shadow_with_skin
render_to_depth_biased_shader                = render_to_depth_skin_shader
render_to_depth_shader                       = render_to_depth_skin_shader
render_to_light_depth_shader                 = render_to_light_depth_skin_shader
skin_shader                                  = skeleton_shader
specular_shader                              = specular_shader_skin
specular_shader_Instanced                    = specular_shader_skin
specular_shader_bump                         = specular_shader_skin_bump
specular_shader_bump_Instanced               = specular_shader_skin_bump
specular_shader_noskin_bump_high             = specular_shader_skin_bump_high
specular_shader_noskin_bump_high_Instanced   = specular_shader_skin_bump_high
standart_shader_bump_nospec                  = standart_shader_skin_bump_nospec
standart_shader_bump_nospec_high             = standart_shader_skin_bump_nospec_high
standart_shader_bump_nospec_high_Instanced   = standart_shader_skin_bump_nospec_high
standart_shader_nobump_nospec                = standart_shader_skin_nobump_nospec
tex_mul_color                                = skeleton_shader
tex_mul_color_alpha                          = skeleton_shader
tex_mul_color_mul_factor                     = skeleton_shader
tex_mul_color_mul_factor_alpha               = skeleton_shader
tex_mul_color_mul_factor_alpha_static        = skeleton_shader
tex_mul_color_static                         = skeleton_shader
tex_mul_factor                               = skeleton_shader
tex_mul_factor_alpha                         = skeleton_shader
faceshader_high                              = faceshader_high_skin            ; needs the patched effect and wse2_shaders.brf
faceshader_high_specular                     = faceshader_high_specular_skin   ; needs the patched effect and wse2_shaders.brf
faceshader_simple                            = faceshader_simple_skin          ; needs the patched effect and wse2_shaders.brf
simple_shader                                = simple_shader_with_skin         ; needs the patched effect and wse2_shaders.brf
simple_shader_no_mip                         = simple_shader_no_mip_with_skin  ; needs the patched effect and wse2_shaders.brf

; the way back: a skinning shader on a mesh that turned out to have no bone weights
[NoSkinFallback]
iron_shader_skin                       = iron_shader
nospecular_shader_skin_bump            = nospecular_shader_bump
nospecular_shader_skin_bump_high       = nospecular_shader_noskin_bump_high
nospecular_shader_skin_bump_high_aniso = nospecular_shader_noskin_bump_high  ; counterpart drops the second diffuse map
render_character_shadow_with_skin      = render_character_shadow
render_to_depth_skin_shader            = render_to_depth_shader
render_to_light_depth_skin_shader      = render_to_light_depth_shader
skeleton_shader                        = tex_mul_color
specular_shader_skin                   = specular_shader
specular_shader_skin_bump              = specular_shader_bump
specular_shader_skin_bump_high         = specular_shader_noskin_bump_high
specular_shader_skin_bump_high_aniso   = specular_shader_noskin_bump_high    ; counterpart drops the second diffuse map
standart_shader_skin_bump_nospec       = standart_shader_bump_nospec
standart_shader_skin_bump_nospec_high  = standart_shader_bump_nospec_high
standart_shader_skin_nobump_nospec     = standart_shader_nobump_nospec
faceshader_high_skin                   = faceshader_high                     ; needs the patched effect and wse2_shaders.brf
faceshader_high_specular_skin          = faceshader_high_specular            ; needs the patched effect and wse2_shaders.brf
faceshader_simple_skin                 = faceshader_simple                   ; needs the patched effect and wse2_shaders.brf
simple_shader_no_mip_with_skin         = simple_shader_no_mip                ; needs the patched effect and wse2_shaders.brf
simple_shader_with_skin                = simple_shader                       ; needs the patched effect and wse2_shaders.brf
